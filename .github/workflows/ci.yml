name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imai
          POSTGRES_PASSWORD: imai_secret
          POSTGRES_DB: imai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck -w @imai/backend

      - name: Build backend
        run: npm run build -w @imai/backend

      - name: Typecheck frontend
        run: npm run typecheck -w @imai/frontend

      - name: Build frontend
        run: npm run build -w @imai/frontend

      - name: Test backend (unit + guards, needs imai_test DB)
        run: npm test -w @imai/backend
