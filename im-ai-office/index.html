<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>对话式 AI 办公 · MVP Demo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0;
         background: #f5f6fa; color: #20263f; }
  .wrap { display: flex; height: 100vh; }
  .left { flex: 1; padding: 28px; overflow-y: auto; border-right: 1px solid #e5e9f2; }
  .right { width: 400px; padding: 28px; overflow-y: auto; background: #fff; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #5a6482; margin-bottom: 20px; font-size: 13px; }
  .inputrow { display: flex; gap: 8px; }
  textarea { flex: 1; height: 74px; padding: 12px; border: 1px solid #ccd4e6; border-radius: 10px;
             font-size: 14px; resize: vertical; }
  .sender { width: 130px; padding: 8px; border: 1px solid #ccd4e6; border-radius: 10px; font-size: 13px; }
  button { background: #1E2761; color: #fff; border: 0; padding: 10px 18px; border-radius: 10px;
           font-size: 14px; cursor: pointer; }
  button.ghost { background: #eef2fb; color: #1E2761; }
  button.green { background: #1a9e6c; }
  button.red { background: #d64550; }
  .card { background: #fff; border: 1px solid #e5e9f2; border-radius: 12px; padding: 16px; margin-top: 16px; }
  .tag { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; margin-right: 6px; }
  .t-high { background: #e5f8ef; color: #1a9e6c; }
  .t-mid { background: #fff2e2; color: #b2500f; }
  .t-low { background: #f0f1f6; color: #5a6482; }
  .kv { font-size: 13px; margin: 4px 0; }
  .kv b { color: #1E2761; }
  .task { background: #fff; border: 1px solid #e5e9f2; border-radius: 10px; padding: 12px; margin-top: 10px; }
  .task .status { font-size: 12px; color: #5a6482; }
  .task .btns { margin-top: 8px; display: flex; gap: 8px; }
  .task .btns button { padding: 5px 12px; font-size: 12px; }
  .evt { background: #f7f8fc; border-radius: 8px; padding: 8px 12px; font-size: 12px;
         margin-top: 8px; color: #4a5470; }
  pre { white-space: pre-wrap; font-size: 12px; color: #5a6482; }
  .rule { margin: 16px 0; padding-top: 12px; border-top: 1px dashed #dfe4ef; color: #8a93c4; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <h1>对话式 AI 办公 · MVP</h1>
    <div class="sub">输入一条群消息，跑通「意图判定 → 归属消歧 → 任务落库 → 人审确认 → 看板 → 提醒」</div>
    <div class="inputrow">
      <textarea id="msg" placeholder="例如：小张 你来跟进这个方案，周五前给我"></textarea>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input class="sender" id="sender" value="李娜(娜姐)" title="消息发送者" />
        <button onclick="sendMsg()">发送消息</button>
      </div>
    </div>
    <div class="rule">
      试一下：<br>
      · "小张 你来跟进这个方案，周五前给我" → 两个小张，触发私聊消歧<br>
      · "这次618复盘我来负责，下周一出报告" → 自认领，归属说话人<br>
      · "今天天气怎么样" → 非任务，静默跳过
    </div>
    <div id="result"></div>
  </div>

  <div class="right">
    <h2 style="font-size:17px;margin:0 0 8px;">📊 任务看板</h2>
    <button class="ghost" onclick="loadTasks()" style="width:100%;margin-bottom:12px;">刷新看板</button>
    <div id="board"></div>
    <h2 style="font-size:17px;margin:20px 0 8px;">⚡ 事件流</h2>
    <div id="events"></div>
  </div>
</div>

<script>
const fmt = (s) => (s == null ? "—" : s);
function renderResult(r) {
  const box = document.getElementById("result");
  const confCls = { "high": "t-high", "medium": "t-mid", "low": "t-low" };
  const intent = r.intent || {};
  let html = `<div class="card"><b>🤖 意图判定</b>`;
  html += ` <span class="tag ${confCls[intent.confidence] || 't-low'}">${fmt(intent.confidence)}</span>`;
  html += ` <span class="tag t-low">mode=${fmt(intent.assign_mode)}</span> is_task=${fmt(intent.is_task)}</div>`;

  if (r.action === "skip") {
    html += `<div class="card" style="color:#1a9e6c;">✅ 非任务，静默不进看板</div>`;
  } else if (r.action === "confirm_assignee") {
    const labels = (r.assign && r.assign.ambiguous_labels) || [];
    html += `<div class="card"><b>⚠️ 归属歧义</b> 多个同名候选：<br>`;
    html += labels.map(l => `<div class="kv">· ${l.label}</div>`).join("");
    html += `<div class="kv" style="color:#b2500f;margin-top:8px;">→ 需【私聊发送者】确认具体哪一个（不进群，低打扰）</div></div>`;
  } else if (r.action === "task_created") {
    const t = r.task || {};
    html += `<div class="card"><b>📋 任务已落库</b>
      <div class="kv">内容：${fmt(t.content)}</div>
      <div class="kv">负责人：${fmt(t.assignee)}</div>
      <div class="kv">截止：${fmt(t.deadline)}</div>
      <div class="kv">状态：pending_confirmation（待发送人确认）</div>
      <div class="btns" style="margin-top:10px;display:flex;gap:8px;">
        <button class="green" onclick="confirm(${t.taskId})">确认</button>
        <button class="red" onclick="reject(${t.taskId})">驳回</button>
      </div></div>`;
  }
  box.innerHTML = html + box.innerHTML;
}
async function sendMsg() {
  const message = document.getElementById("msg").value.trim();
  const sender = document.getElementById("sender").value.trim();
  if (!message) return;
  const res = await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, sender }),
  });
  const data = await res.json();
  renderResult(data);
  loadTasks();
}
async function confirm(id) {
  await fetch(`/api/tasks/${id}/confirm`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  loadTasks();
}
async function reject(id) {
  await fetch(`/api/tasks/${id}/reject`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason: "负责人错了" }) });
  loadTasks();
}
async function loadTasks() {
  const res = await fetch("/api/tasks");
  const data = await res.json();
  const board = document.getElementById("board");
  const stMap = { pending_confirmation: "待确认", confirmed: "已确认", rejected: "已驳回" };
  board.innerHTML = data.tasks.map(t => `
    <div class="task"><b>${fmt(t.content).slice(0, 34)}</b>
      <div class="status">#${t.id} · ${stMap[t.status] || t.status} · 负责人 ${fmt(t.assignee)} · 截止 ${fmt(t.deadline)}</div>
      <div class="btns">${t.status === "pending_confirmation" ? `<button class="green" onclick="confirm(${t.id})">确认</button><button class="red" onclick="reject(${t.id})">驳回</button>` : ""}</div>
    </div>`).join("") || "<div class='sub'>暂无任务</div>";
  document.getElementById("events").innerHTML = (data.events || []).map(e =>
    `<div class="evt">⚡ ${fmt(e.event)} · task=${fmt(e.taskId)} ${e.assignee ? "· " + fmt(e.assignee) : ""} ${e.tier ? "· tier=" + e.tier : ""}</div>`
  ).join("") || "<div class='sub'>暂无事件</div>";
}
window.onload = loadTasks;
</script>
</body>
</html>
