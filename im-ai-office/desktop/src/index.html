<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IMAI办公助手</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #1f2329; }
  .app { display: flex; height: 100vh; }

  /* 登录页 */
  .login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #1E2761 0%, #3a4db8 100%); }
  .login-box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); width: 360px; }
  .login-box h1 { font-size: 24px; margin: 0 0 8px; text-align: center; color: #1E2761; }
  .login-box .sub { text-align: center; color: #5a6482; font-size: 13px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 12px 14px; border: 1px solid #e8eaf0; border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: #1E2761; }
  .login-box button { width: 100%; padding: 12px; background: #1E2761; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .login-box button:hover { background: #2a37a0; }
  .user-switch { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .user-switch label { font-size: 12px; color: #8f959e; white-space: nowrap; }
  .user-switch select { flex: 1; padding: 10px 12px; border: 1px solid #e8eaf0; border-radius: 10px; font-size: 13px; background: #fff; color: #1E2761; outline: none; cursor: pointer; }
  .user-switch select:focus { border-color: #1E2761; }
  .login-box .tip { margin-top: 16px; text-align: center; font-size: 12px; color: #8f959e; }

  /* 左侧导航 */
  .sidebar { width: 64px; background: #1E2761; display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; font-weight: bold; color: #1E2761; font-size: 14px; }
  .nav-item { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6); margin-bottom: 8px; cursor: pointer; transition: 0.2s; font-size: 20px; }
  .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.12); color: #fff; }
  .nav-bottom { margin-top: auto; }

  /* 会话列表 */
  .session-list { width: 240px; background: #fff; border-right: 1px solid #e8eaf0; display: flex; flex-direction: column; }
  .session-header { padding: 16px; border-bottom: 1px solid #f0f1f5; }
  .session-header h2 { font-size: 18px; margin: 0; }
  .session-search { padding: 12px 16px; }
  .session-search input { width: 100%; padding: 8px 12px; border: 1px solid #e8eaf0; border-radius: 8px; font-size: 13px; background: #f7f8fa; }
  .session { padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .session:hover { background: #f7f8fa; }
  .session.active { background: #eef2fb; }
  .avatar { width: 40px; height: 40px; border-radius: 10px; background: #1E2761; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }
  .avatar.ai { background: linear-gradient(135deg, #1E2761, #3a4db8); }
  .session-info { flex: 1; min-width: 0; }
  .session-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-preview { font-size: 12px; color: #8f959e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-meta { text-align: right; }
  .session-time { font-size: 11px; color: #8f959e; }
  .badge { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; text-align: center; background: #d64550; color: #fff; border-radius: 9px; font-size: 11px; padding: 0 5px; margin-top: 4px; }

  /* 聊天区 */
  .chat { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
  .chat-header { padding: 14px 20px; border-bottom: 1px solid #f0f1f5; display: flex; align-items: center; justify-content: space-between; }
  .chat-title { font-size: 16px; font-weight: 600; }
  .chat-sub { font-size: 12px; color: #8f959e; margin-top: 2px; }
  .chat-actions { display: flex; gap: 8px; }
  .chat-actions button { background: #f2f3f5; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; color: #5a6482; cursor: pointer; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; background: #f9fafc; }
  .msg { display: flex; gap: 10px; margin-bottom: 20px; }
  .msg.self { flex-direction: row-reverse; }
  .msg.self .msg-content { background: #1E2761; color: #fff; border-radius: 16px 16px 4px 16px; }
  .msg-content { background: #fff; padding: 12px 14px; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); max-width: 70%; font-size: 14px; line-height: 1.5; }
  .msg-meta { font-size: 11px; color: #8f959e; margin-top: 4px; padding: 0 4px; }
  .msg.self .msg-meta { text-align: right; }

  /* AI 卡片 */
  .ai-card { background: #fff; border: 1px solid #e8eaf0; border-radius: 12px; padding: 16px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .ai-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .ai-icon { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(135deg, #1E2761, #3a4db8); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
  .ai-card-title { font-weight: 600; font-size: 14px; }
  .ai-card-body { font-size: 13px; color: #5a6482; line-height: 1.6; }
  .ai-card-body b { color: #1E2761; }
  .ai-card-btns { display: flex; gap: 8px; margin-top: 12px; }
  .ai-card-btns button { border: none; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .ai-card-btns .primary { background: #1a9e6c; color: #fff; }
  .ai-card-btns .secondary { background: #f2f3f5; color: #5a6482; }
  .ai-card-btns .danger { background: #fae1e3; color: #d64550; }

  /* 输入区 */
  .input-area { padding: 16px 20px; border-top: 1px solid #f0f1f5; background: #fff; }
  .sim-area { border-top: 1px solid #f0f1f5; background: #fbfcfe; }
  .sim-toggle { padding: 8px 20px; font-size: 12px; color: #5a6482; cursor: pointer; user-select: none; }
  .sim-toggle:hover { color: #1E2761; }
  .sim-box { padding: 8px 20px 12px; display: flex; gap: 8px; }
  .sim-input { flex: 1; padding: 7px 10px; border: 1px solid #e8eaf0; border-radius: 8px; font-size: 12px; }
  .sim-btn { background: #1E2761; color: #fff; border: none; padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .input-box { display: flex; align-items: flex-end; gap: 10px; background: #f5f6fa; border-radius: 12px; padding: 10px 12px; }
  .input-box textarea { flex: 1; border: none; background: transparent; resize: none; font-size: 14px; outline: none; min-height: 20px; max-height: 120px; font-family: inherit; }
  .input-box button { background: #1E2761; color: #fff; border: none; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* 右侧看板 */
  .board { width: 340px; background: #fff; border-left: 1px solid #e8eaf0; display: flex; flex-direction: column; }
  .board-header { padding: 12px 16px; border-bottom: 1px solid #f0f1f5; }
  .board-tabs { display: flex; gap: 8px; }
  .board-tabs .tab { background: #f2f3f5; border: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; color: #5a6482; cursor: pointer; }
  .board-tabs .tab.active { background: #1E2761; color: #fff; }
  .board-columns { flex: 1; overflow-y: auto; padding: 16px; }
  .panel-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-title { font-size: 13px; font-weight: 600; color: #1E2761; }
  .panel-toolbar button { background: #f2f3f5; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; color: #5a6482; cursor: pointer; }
  .approval-item { background: #f9fafc; border: 1px solid #eef0f4; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .approval-item .a-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .approval-item .a-action { font-weight: 600; font-size: 13px; color: #1E2761; }
  .approval-item .a-detail { font-size: 12px; color: #5a6482; white-space: pre-wrap; margin-bottom: 10px; }
  .approval-item .a-btns { display: flex; gap: 8px; }
  .approval-item .a-btns button { flex: 1; border: none; padding: 7px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .approval-item .a-yes { background: #1a9e6c; color: #fff; }
  .approval-item .a-no { background: #f2f3f5; color: #5a6482; }
  .approval-empty { text-align: center; color: #8f959e; font-size: 13px; padding: 32px 0; }
  .memory-block { margin-bottom: 16px; }
  .memory-block-title { font-size: 13px; font-weight: 600; color: #5a6482; margin-bottom: 8px; }
  .memory-term { font-size: 13px; color: #1E2761; margin-bottom: 6px; }
  .memory-term b { color: #1a9e6c; }
  .summary-text { font-size: 13px; color: #2a3245; line-height: 1.7; background: #f9fafc; border: 1px solid #eef0f4; border-radius: 10px; padding: 14px; white-space: pre-wrap; }
  .board-col-title { font-size: 13px; font-weight: 600; color: #5a6482; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .board-col-title span { color: #8f959e; font-weight: normal; }
  .task-card { background: #f9fafc; border-radius: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid #f0f1f5; }
  .task-card-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; line-height: 1.4; }
  .task-card-meta { font-size: 11px; color: #8f959e; display: flex; align-items: center; gap: 8px; }
  .task-proof { font-size: 10px; color: #1a9e6c; margin-top: 6px; line-height: 1.4; }
  .task-card-meta .tag { padding: 1px 6px; border-radius: 4px; font-size: 10px; }
  .tag-high { background: #e5f8ef; color: #1a9e6c; }
  .tag-mid { background: #fff2e2; color: #b2500f; }
  .tag-low { background: #f0f1f6; color: #5a6482; }

  /* 后端状态 */
  .backend-status { position: fixed; top: 12px; right: 18px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5a6482; background: rgba(255,255,255,0.9); padding: 4px 10px; border-radius: 20px; z-index: 100; }
  .backend-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #d64550; }
  .backend-status .dot.ok { background: #1a9e6c; }
  .backend-status button { display: none; padding: 2px 8px; font-size: 11px; border: none; border-radius: 4px; background: #1E2761; color: #fff; cursor: pointer; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>IMAI办公助手</h1>
    <div class="sub">AI 赋能的办公协同 IM</div>
    <input type="text" id="loginUser" placeholder="OpenIM 用户ID（如 user001）" value="user001" />
    <input type="password" id="loginPwd" placeholder="密码（MVP 阶段任意填）" />
    <div class="user-switch">
      <label>常用账号：</label>
      <select id="quickUser" onchange="swapUser()">
        <option value="user001" selected>user001 · 李娜</option>
        <option value="user002">user002 · 张敏</option>
        <option value="user003">user003 · 张伟</option>
        <option value="__custom__">自定义…</option>
      </select>
    </div>
    <input type="password" id="loginPassword" placeholder="访问口令（可选，视服务端配置）" style="margin-top:6px;" />
    <button onclick="doLogin()">登录</button>
    <div class="tip">当前仅支持 OpenIM 已有账号登录（imAdmin 是管理账号，不能登录）</div>
  </div>
</div>

<!-- 主界面 -->
<div class="app hidden" id="mainApp">
  <div class="sidebar">
    <div class="logo">IM</div>
    <div class="nav-item active" title="消息">💬</div>
    <div class="nav-item" title="任务">📋</div>
    <div class="nav-item" title="通讯录">👥</div>
    <div class="nav-item nav-bottom" title="设置" onclick="logout()">⏻</div>
  </div>

  <div class="session-list">
    <div class="session-header"><h2>消息</h2></div>
    <div class="session-search"><input type="text" placeholder="搜索会话" /></div>
    <div id="sessionList"></div>
  </div>

  <div class="chat">
    <div class="chat-header">
      <div>
        <div class="chat-title" id="chatTitle">选择会话</div>
        <div class="chat-sub" id="chatSub">点击左侧会话开始聊天</div>
      </div>
      <div class="chat-actions">
        <button onclick="loadTasks()">刷新看板</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="sim-area">
      <div class="sim-toggle" onclick="toggleSim()">🛠 模拟群消息（测试用）</div>
      <div class="sim-box" id="simBox" style="display:none;">
        <input id="simSender" class="sim-input" placeholder="发言人，如 王冰" value="王冰" />
        <input id="simText" class="sim-input" placeholder="消息内容，如 这次活动我来出物料清单，下周三前" />
        <button onclick="sendSim()" class="sim-btn">发送</button>
      </div>
    </div>
    <div class="input-area">
      <div class="input-box">
        <textarea id="msg" rows="1" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>

  <div class="board">
    <div class="board-header">
      <div class="board-tabs">
        <button class="tab active" data-panel="board" onclick="showPanel('board')">看板</button>
        <button class="tab" data-panel="approval" onclick="showPanel('approval');loadApprovals()">审批</button>
        <button class="tab" data-panel="memory" onclick="showPanel('memory');loadMemory()">记忆</button>
        <button class="tab" data-panel="summary" onclick="showPanel('summary');loadSummary()">汇总</button>
      </div>
    </div>

    <div class="board-columns" id="panel-board">
      <div class="board-col">
        <div class="board-col-title">待指派 <span id="countPendingAssignee">0</span></div>
        <div id="listPendingAssignee"></div>
      </div>
      <div class="board-col">
        <div class="board-col-title">待确认 <span id="countPending">0</span></div>
        <div id="listPending"></div>
      </div>
      <div class="board-col">
        <div class="board-col-title">已确认 <span id="countConfirmed">0</span></div>
        <div id="listConfirmed"></div>
      </div>
    </div>

    <div class="board-columns" id="panel-approval" style="display:none;">
      <div class="panel-toolbar">
        <span class="panel-title">待审批（高风险动作）</span>
        <button onclick="loadApprovals()">刷新</button>
      </div>
      <div id="approvalList" class="approval-list"></div>
    </div>

    <div class="board-columns" id="panel-memory" style="display:none;">
      <div class="panel-toolbar">
        <span class="panel-title">团队记忆</span>
        <button onclick="loadMemory()">刷新</button>
      </div>
      <div id="memoryHtml" class="memory-box"></div>
    </div>

    <div class="board-columns" id="panel-summary" style="display:none;">
      <div class="panel-toolbar">
        <span class="panel-title">今日汇总（未定归属）</span>
        <button onclick="loadSummary()">生成</button>
      </div>
      <div id="summaryBox" class="summary-box"></div>
    </div>
  </div>
</div>

<div class="backend-status" id="backendStatus">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">后端连接中...</span>
  <button id="startBtn" onclick="startBackend()">启动后端</button>
  <button id="diagBtn" style="background:#5a6482;" onclick="runDiagnose()">诊断</button>
</div>
<div class="backend-status" id="sdkStatus" style="top:44px;font-weight:600;">SDK 状态：待初始化</div>

<script>
const API_BASE = "http://127.0.0.1:8000";
const fmt = (s) => (s == null ? "—" : s);
let tauriInvoke = null;
try { tauriInvoke = window.__TAURI__.core.invoke; } catch (e) { tauriInvoke = null; }

// 当前登录状态
let currentUser = null;
let currentToken = null;
let currentConversation = null;

async function api(path, opts = {}) {
  const method = (opts.method || "GET").toUpperCase();
  let body = undefined;
  if (opts.body) {
    try { body = JSON.parse(opts.body); } catch (e) { body = opts.body; }
  }
  if (tauriInvoke) {
    try {
      return await tauriInvoke("api_call", { method, path, body });
    } catch (e) {
      throw new Error(`${e} (${path})`);
    }
  }
  const res = await fetch(API_BASE + path, {
    method,
    headers: body !== undefined ? { "Content-Type": "application/json" } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

function logDebug(info) {
  const card = document.createElement("div");
  card.className = "ai-card";
  card.innerHTML = "<b>🐞 诊断信息</b><pre style='font-size:11px;color:#5a6482;'>" + JSON.stringify(info, null, 2) + "</pre>";
  document.getElementById("messages").appendChild(card);
}

function setBackendStatus(ok, text) {
  document.getElementById("statusDot").className = "dot" + (ok ? " ok" : "");
  document.getElementById("statusText").textContent = text;
}

async function startBackend() {
  if (!tauriInvoke) return alert("当前不是桌面应用环境");
  setBackendStatus(false, "正在启动后端...");
  document.getElementById("startBtn").style.display = "none";
  try {
    const status = await tauriInvoke("start_backend");
    setBackendStatus(status.running, status.message);
  } catch (e) {
    setBackendStatus(false, "启动失败");
    logDebug({ action: "start_backend", error: e.message || String(e) });
    document.getElementById("startBtn").style.display = "inline-block";
  }
}

async function runDiagnose() {
  if (!tauriInvoke) return;
  try {
    const info = await tauriInvoke("diagnose");
    logDebug({ action: "diagnose", ...info });
  } catch (e) {
    logDebug({ action: "diagnose", error: e.message || String(e) });
  }
}

async function checkBackend() {
  try {
    await api("/api/tasks");
    setBackendStatus(true, "后端已连接");
  } catch (e) {
    setBackendStatus(false, "后端未启动");
    if (tauriInvoke) document.getElementById("startBtn").style.display = "inline-block";
  }
}

// ============ 登录 ============
function swapUser() {
  const sel = document.getElementById("quickUser");
  const input = document.getElementById("loginUser");
  const v = sel.value;
  if (v === "__custom__") {
    sel.selectedIndex = 0; // 回到默认选项
    input.focus();
    input.select();
    return;
  }
  input.value = v;
}

async function doLogin() {
  const user = document.getElementById("loginUser").value.trim();
  if (!user) return alert("请输入用户ID");
  const password = (document.getElementById("loginPassword") || {}).value || "";
  try {
    const res = await api("/openim/login", { method: "POST", body: JSON.stringify({ user_id: user, password }) });
    if (res.ok) {
      currentUser = user;
      currentToken = res.token;
      localStorage.setItem("imai_user", user);
      localStorage.setItem("imai_token", res.token);
      enterMainApp();
      initSDK(user, res.token);
    } else {
      alert("登录失败：" + res.error);
    }
  } catch (e) {
    alert("登录异常：" + e.message);
  }
}

function logout() {
  localStorage.removeItem("imai_user");
  localStorage.removeItem("imai_token");
  currentUser = null;
  currentToken = null;
  currentConversation = null;
  document.getElementById("mainApp").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
}

// ============ OpenIM SDK 实时消息 ============
let sdk = null;
let connected = false;
let msgCount = 0;
let lastMsgSeq = 0;
let pollTimer = null;

function setSDKStatus(text, ok) {
  const el = document.getElementById("sdkStatus");
  if (!el) return;
  el.textContent = text;
  el.style.color = ok ? "#1a9e6c" : "#d64550";
}

async function initSDK(userID, token) {
  // 通过 Node 消息网关连接 OpenIM（避免 WebView ws 限制）
  setSDKStatus("网关连接中...", false);
  try {
    const res = await api("/gw/login", { method: "POST", body: JSON.stringify({ userID, token }) });
    if (!res.ok) { setSDKStatus("网关登录失败: " + (res.error||""), false); return; }
    setSDKStatus("已连 OpenIM，同步会话...", false);
    await loadGatewayConversations();
    setSDKStatus("IM 已连接 ✅", true);
    startPoll();
  } catch (e) {
    setSDKStatus("网关登录异常: " + (e?.message||e), false);
  }
}

async function loadGatewayConversations() {
  try {
    const res = await api("/gw/conversations", { method: "GET" });
    if (res.ok) renderSessions(res.conversations || []);
  } catch (e) { console.warn("conv err", e); }
}

function startPoll() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const res = await api(`/gw/poll?since=${lastMsgSeq}`, { method: "GET" });
      if (res.ok && res.messages && res.messages.length) {
        res.messages.forEach(m => renderGWMessage(m));
        lastMsgSeq = res.lastSeq || lastMsgSeq;
        msgCount += res.messages.length;
        setSDKStatus(`IM 已连接 ✅ · 收 ${msgCount} 条`, true);
      }
    } catch (e) {}
  }, 1500);
}

function renderSessions(convs) {
  const box = document.getElementById("sessionList");
  let html = `<div class="session" id="aiSession" onclick="selectAISession()">
      <div class="avatar ai">AI</div>
      <div class="session-info"><div class="session-title">AI 助手</div><div class="session-preview">任务确认与提醒</div></div>
      <div class="session-meta"><span class="badge" id="aiUnread" style="display:none">0</span></div>
    </div>`;
  html += (convs || []).map(c => {
    const name = c.showName || (c.groupID ? `群 ${c.groupID}` : (c.userID || "会话"));
    const type = c.conversationType === 3 ? 3 : 1;
    const last = c.latestMsg ? (JSON.parse(c.latestMsg)?.textElem?.content || "") : "";
    return `<div class="session" onclick="selectConversation('${c.conversationID}', '${c.groupID || c.userID}', '${(name).replace(/'/g,"\\'")}', ${type})">
      <div class="avatar">${name.slice(0,1)}</div>
      <div class="session-info"><div class="session-title">${name}</div>
      <div class="session-preview">${last || "暂无消息"}</div></div>
      <div class="session-meta">${c.unreadCount ? `<span class="badge">${c.unreadCount}</span>` : ""}</div>
    </div>`;
  }).join("");
  box.innerHTML = html;
}

function renderGWMessage(m) {
  const box = document.getElementById("messages");
  if (!box) return;
  const self = m.sendID === currentUser;
  const sender = m.senderNickname || m.sendID || "未知";
  const d = document.createElement("div");
  d.className = "msg" + (self ? " self" : "");
  d.innerHTML = `<div class="avatar">${(self ? "我" : sender.slice(0,1))}</div>
    <div><div class="msg-content">${(m.content||"").replace(/\n/g,"<br>")}</div>
    <div class="msg-meta"${self ? ' style="text-align:right;"' : ""}>${self ? "你" : sender} ${new Date(m.sendTime||Date.now()).toLocaleTimeString()}</div></div>`;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function renderConversationsFromSDK(convs) { renderSessions(convs || []); }

function handleSDKMessage(m) {

}

// ============ 会话 ============
async function loadConversations() {

    renderConversations(res.conversations || []);
  } catch (e) {
    alert("获取会话异常：" + e.message);
  }
}

function renderConversations(list) {

let inAISession = false;

async function selectAISession() {
  inAISession = true;
  currentConversation = { id: "ai_dm", targetId: "imai_assistant", name: "AI 助手", type: "ai" };
  document.getElementById("chatTitle").textContent = "AI 助手";
  document.getElementById("chatSub").textContent = "任务确认与智能提醒";
  document.getElementById("messages").innerHTML = "";
  document.querySelectorAll(".session").forEach(el => el.classList.remove("active"));
  document.getElementById("aiSession").classList.add("active");
  await loadAIMessages();
}

async function loadAIMessages() {
  try {
    const res = await api("/api/ai_dm", { method: "GET", headers: { "Content-Type": "application/json" }, body: null });
    if (!res.ok) return;
    const box = document.getElementById("messages");
    box.innerHTML = "";
    (res.messages || []).forEach(m => {
      const self = m.direction === "in";
      const d = document.createElement("div");
      d.className = "msg" + (self ? " self" : "");
      d.innerHTML = `<div class="avatar ${self ? "" : "ai"}">${self ? "我" : "AI"}</div>
        <div><div class="msg-content">${(m.content || "").replace(/\n/g,"<br>")}</div>
        <div class="msg-meta"${self ? ' style="text-align:right;"' : ""}>${m.ts || ""}</div></div>`;
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
    // 已读
    await api("/api/ai_dm/read", { method: "POST", body: JSON.stringify({}) });
    updateAIUnread();
  } catch (e) {}
}

async function updateAIUnread() {
  try {
    const res = await api("/api/ai_dm");
    const el = document.getElementById("aiUnread");
    const cnt = res.unread || 0;
    el.style.display = cnt ? "inline-block" : "none";
    el.textContent = cnt;
  } catch (e) {}
}

function selectConversation(convId, targetId, name, convType) {
  currentConversation = { id: convId, targetId, name, type: convType };
  document.getElementById("chatTitle").textContent = name;
  document.getElementById("chatSub").textContent = convType === 3 ? "群聊 · AI 旁听中" : "单聊";
  document.getElementById("messages").innerHTML = "";
  document.querySelectorAll(".session").forEach(el => el.classList.remove("active"));
  // 简单高亮当前点击
  event?.currentTarget?.classList?.add("active");
  loadMessageHistory(convId);
}

async function loadMessageHistory(convId) {
  try {
    const res = await api(`/api/messages?conv_id=${encodeURIComponent(convId)}`);
    if (!res.messages || !res.messages.length) return;
    const box = document.getElementById("messages");
    box.innerHTML = "";
    (res.messages || []).forEach(m => {
      const self = m.is_self == 1;
      const d = document.createElement("div");
      d.className = "msg" + (self ? " self" : "");
      d.innerHTML = `<div class="avatar">${(self ? "我" : (m.sender_name || "?")).slice(0,1)}</div>
        <div><div class="msg-content">${(m.content || "").replace(/\n/g,"<br>")}</div>
        <div class="msg-meta"${self ? ' style="text-align:right;"' : ""}>${self ? "你" : (m.sender_name || "")} ${m.ts || ""}</div></div>`;

    });
    box.scrollTop = box.scrollHeight;
  } catch (e) {}
}

// ============ 消息 ============
function toggleSim() {
  const box = document.getElementById("simBox");
  box.style.display = box.style.display === "none" ? "flex" : "none";
}

async function sendSim() {
  const sender = document.getElementById("simSender").value.trim() || "同事";
  const text = document.getElementById("simText").value.trim();
  if (!text) return alert("请输入消息内容");
  const convId = "sg_simulated";
  try {
    const res = await api("/api/simulate_message", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sender, text, conv_id: convId }) });
    if (res.ok) {
      // 显示到聊天区（别人发的，左侧）
      const box = document.getElementById("messages");
      const d = document.createElement("div");
      d.className = "msg";
      d.innerHTML = `<div class="avatar">${sender.slice(0,1)}</div>
        <div><div class="msg-content">${text.replace(/\n/g,"<br>")}</div>
        <div class="msg-meta">${sender} 刚刚</div></div>`;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
      // AI 卡片
      if (res.ai) renderAICard(res.ai);
      // 刷新看板
      loadTasks();
      document.getElementById("simText").value = "";
    } else {
      alert("模拟失败：" + res.error);
    }
  } catch (e) {
    alert("模拟异常：" + e.message);
  }
}

async function sendMsg() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  if (!currentConversation) return alert("请先选择一个会话");

  // 本地先渲染
  const msgs = document.getElementById("messages");
  const selfMsg = document.createElement("div");
  selfMsg.className = "msg self";
  selfMsg.innerHTML = `<div class="msg-content">${text.replace(/\n/g,"<br>")}</div><div class="msg-meta" style="text-align:right;">你 刚刚</div>`;
  msgs.appendChild(selfMsg);
  msgs.scrollTop = msgs.scrollHeight;
  input.value = "";

  // AI 助手会话：回复数字确认
  if (currentConversation.type === "ai") {
    try {
      const res = await api("/api/tasks/resolve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sender_id: currentUser, choice: text }) });
      if (!res.ok) {
        alert("确认失败：" + (res.error || res.reason || "无待确认任务"));
      } else {
        await loadAIMessages();
        loadTasks();
      }
    } catch (e) {
      alert("确认异常：" + e.message);
    }
    return;
  }

  // 群聊/单聊：调网关发送（双工）
  try {
    const payload = {
      content: text,
    };
    if (currentConversation.type === 3) {
      payload.groupID = currentConversation.targetId;
    } else {
      payload.recvID = currentConversation.targetId;
    }
    const res = await api("/gw/send", { method: "POST", body: JSON.stringify(payload) });
    if (!res.ok) {
      alert("发送失败：" + (res.error || "网关未连接"));
    } else {
      // 后端 AI 识别
      try {
        const aiRes = await api("/api/sdk_message", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sender: currentUser, text, conv_id: currentConversation.id, send_id: currentUser }) });
        if (aiRes && aiRes.ai) { renderAICard(aiRes.ai); loadTasks(); }
      } catch(e) {}
    }
    // 发送后刷新看板
    setTimeout(loadTasks, 1500);
    updateAIUnread();
  } catch (e) {
    alert("发送异常：" + e.message);
  }
}

// ============ 看板 ============
function renderTaskCard(t) {
  const confCls = { high: "tag-high", medium: "tag-mid", low: "tag-low" };
  const isPending = t.status === "pending_confirmation";
  const proofs = (t.proofs || []).map(p => `${p.term}=${p.meaning || ""}`).slice(0, 2);
  return `
    <div class="task-card">
      <div class="task-card-title">${fmt(t.content)}</div>
      <div class="task-card-meta">
        <span>#${t.id}</span>
        <span>${fmt(t.assignee)}</span>
        <span>${fmt(t.deadline)}</span>
        ${t.confidence ? `<span class="tag ${confCls[t.confidence]||'tag-low'}">${t.confidence}</span>` : ""}
      </div>
      ${proofs.length ? `<div class="task-proof">依据：${esc(proofs.join("；"))}</div>` : ""}
      ${isPending ? `<div class="ai-card-btns" style="margin-top:10px;">
        <button class="primary" onclick="confirmTask(${t.id})">确认</button>
        <button class="danger" onclick="rejectTask(${t.id})">驳回</button>
      </div>` : ""}
    </div>
  `;
}

async function confirmTask(id) {
  await api(`/api/tasks/${id}/confirm`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  loadTasks();
}

async function rejectTask(id) {
  await api(`/api/tasks/${id}/reject`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason: "负责人错了" }) });
  loadTasks();
}

async function loadTasks() {
  try {
    const data = await api("/api/tasks");
    const pendingAssignee = data.tasks.filter(t => t.status === "pending_assignee");
    const pending = data.tasks.filter(t => t.status === "pending_confirmation");
    const confirmed = data.tasks.filter(t => t.status === "confirmed");
    document.getElementById("countPendingAssignee").textContent = pendingAssignee.length;
    document.getElementById("countPending").textContent = pending.length;
    document.getElementById("countConfirmed").textContent = confirmed.length;
    document.getElementById("listPendingAssignee").innerHTML = pendingAssignee.map(renderTaskCard).join("") || "<div style='color:#8f959e;font-size:12px;'>暂无待指派任务</div>";
    document.getElementById("listPending").innerHTML = pending.map(renderTaskCard).join("") || "<div style='color:#8f959e;font-size:12px;'>暂无待确认任务</div>";
    document.getElementById("listConfirmed").innerHTML = confirmed.map(renderTaskCard).join("") || "<div style='color:#8f959e;font-size:12px;'>暂无已确认任务</div>";
    setBackendStatus(true, "后端已连接");
  } catch (e) {
    setBackendStatus(false, "后端未连接");
  }
}

// ============ M3/M4 前端面板 ============
function showPanel(name) {
  document.getElementById("panel-board").style.display = name === "board" ? "" : "none";
  document.getElementById("panel-approval").style.display = name === "approval" ? "" : "none";
  document.getElementById("panel-memory").style.display = name === "memory" ? "" : "none";
  document.getElementById("panel-summary").style.display = name === "summary" ? "" : "none";
  document.querySelectorAll(".board-tabs .tab").forEach(t => {
    t.classList.toggle("active", t.dataset.panel === name);
  });
}

async function loadSummary() {
  const box = document.getElementById("summaryBox");
  try {
    const data = await api("/api/summary/daily");
    const text = (data.text || "").replace(/\n/g, "<br>");
    box.innerHTML = `<div class="summary-text">${esc(text)}</div>`;
  } catch (e) {
    box.innerHTML = `<div class='approval-empty'>生成失败：${esc(e.message)}</div>`;
  }
}

async function loadApprovals() {
  const box = document.getElementById("approvalList");
  try {
    const data = await api("/api/approvals?status=pending");
    const list = data.approvals || [];
    if (!list.length) {
      box.innerHTML = "<div class='approval-empty'>暂无待审批的高风险动作 ✅</div>";
      return;
    }
    box.innerHTML = list.map(a => {
      let detail = "";
      try { detail = JSON.stringify(JSON.parse(a.detail), null, 2); } catch(e) { detail = a.detail; }
      return `<div class="approval-item">
        <div class="a-head"><span class="a-action">${esc(a.action)}</span><span style="font-size:11px;color:#8f959e;">#${a.id}</span></div>
        <div class="a-detail">${esc(detail)}</div>
        <div class="a-btns">
          <button class="a-yes" onclick="approveApproval(${a.id})">批准</button>
          <button class="a-no" onclick="rejectApproval(${a.id})">拒绝</button>
        </div>
      </div>`;
    }).join("");
  } catch (e) {
    box.innerHTML = `<div class='approval-empty'>加载失败：${esc(e.message)}</div>`;
  }
}

async function approveApproval(id) {
  try {
    const r = await api(`/api/approvals/${id}/decide`, { method: "POST", body: JSON.stringify({ approved: true }) });
    alert(r.ok ? "已批准" : "批准失败：" + (r.error || ""));
    loadApprovals(); loadTasks();
  } catch (e) { alert("批准异常：" + e.message); }
}

async function rejectApproval(id) {
  try {
    const r = await api(`/api/approvals/${id}/decide`, { method: "POST", body: JSON.stringify({ approved: false }) });
    alert(r.ok ? "已拒绝" : "拒绝失败：" + (r.error || ""));
    loadApprovals();
  } catch (e) { alert("拒绝异常：" + e.message); }
}

async function loadMemory() {
  const box = document.getElementById("memoryHtml");
  try {
    const data = await api("/api/memory");
    const terms = data.memory.terms || [];
    const gm = data.memory.grp_meta;
    let html = "";
    if (gm && gm.intro) {
      html += `<div class="memory-block"><div class="memory-block-title">群简介</div><div class="memory-term">${esc(gm.intro)}</div></div>`;
    }
    html += `<div class="memory-block"><div class="memory-block-title">术语 / 人称记忆（${terms.length}）</div>`;
    if (terms.length) {
      html += terms.map(t => `<div class="memory-term"><b>${esc(t.term)}</b> = ${esc(t.meaning)} <span style="color:#8f959e;font-size:11px;">[${esc(t.source)}]</span></div>`).join("");
    } else {
      html += `<div style="color:#8f959e;font-size:12px;">暂无记忆，驳回/纠正会沉淀</div>`;
    }
    html += `</div>`;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class='approval-empty'>加载失败：${esc(e.message)}</div>`;
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
}

function renderAICard(r) {
  const box = document.getElementById("messages");
  if (!box) return;
  const intent = r.intent || {};
  let body = "";
  if (r.action === "skip") {
    body = "未识别到任务安排，已静默跳过。";
  } else if (r.action === "confirm_assignee") {
    const labels = (r.task?.candidates) || (r.assign?.ambiguous_labels) || [];
    body = `<b>归属歧义</b>：检测到多个负责人，请到【AI 助手】会话回复数字确认。<br>`;
    body += labels.map((c, i) => `${i+1}. ${c.label}`).join("<br>");
  } else if (r.action === "task_created") {
    const t = r.task || {};
    body = `<b>已生成任务</b>：${fmt(t.content)}<br>负责人：${fmt(t.assignee)}<br>截止：${fmt(t.deadline)}`;
  }
  const card = document.createElement("div");
  card.className = "ai-card";
  card.innerHTML = `<div class="ai-card-header"><div class="ai-icon">AI</div><div class="ai-card-title">AI 助手</div></div><div class="ai-card-body">${body}</div>`;
  box.appendChild(card);
  box.scrollTop = box.scrollHeight;
}

// Step2 实时事件（SSE，后端 async 模式才有事件；sync 模式下 EventSource 会静默重试、无影响）
let esAI = null;
function initSSE() {
  if (!window.EventSource || esAI) return;
  try {
    esAI = new EventSource(API_BASE + "/api/events/stream");
    esAI.onmessage = (e) => {
      try {
        const ev = JSON.parse(e.data);
        if (ev.type === "task_created" || ev.type === "ai.card") loadTasks();
        if (ev.type === "task_created") updateAIUnread();
      } catch (_) {}
    };
    // EventSource 断线自动重连；无需手动重建
  } catch (_) { esAI = null; }
}

  const savedUser = localStorage.getItem("imai_user");

  if (savedUser && savedToken) {

    currentToken = savedToken;
    enterMainApp();
    initSDK(savedUser, savedToken);
  }
  setInterval(checkBackend, 3000);
  setInterval(loadTasks, 5000);
  setInterval(updateAIUnread, 5000);
  initSSE();   // 新增：实时事件推送（轮询保留作兑底）
  if (tauriInvoke) setTimeout(startBackend, 500);
};
