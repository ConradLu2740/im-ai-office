<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IMAI办公助手</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>IMAI办公助手</h1>
    <div class="sub">AI 赋能的办公协同 IM</div>
    <input type="text" id="loginUser" placeholder="用户名（user001）" value="user001" />
    <input type="password" id="loginPwd" placeholder="密码" />
    <div class="user-switch" style="display:none;">
      <label>常用账号：</label>
      <select id="quickUser">
        <option value="user001" selected>user001 · 李娜</option>
        <option value="user002">user002 · 张敏</option>
        <option value="user003">user003 · 张伟</option>
        <option value="__custom__">自定义…</option>
      </select>
    </div>
    <button data-action="doLogin">登录</button>
    <div class="tip">使用管理员分发的用户名与密码登录</div>
  </div>
</div>

<!-- 主界面 -->
<div class="app hidden" id="mainApp">

  <!-- 左侧导航（76px） -->
  <div class="nav">
    <div class="logo">IM</div>
    <button class="nitem" data-action="nav" data-view="chat" title="聊天">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3c-1.5 0-2.9-.3-4.1-1L3 20l1.3-4.2A8.1 8.1 0 0 1 3.5 11.5 8.4 8.4 0 0 1 12 3.2a8.4 8.4 0 0 1 9 8.3z"/></svg>
      <div class="lb">聊天</div><span class="bdg" id="bdg-chat"></span>
    </button>
    <button class="nitem" data-action="nav" data-view="task" title="任务">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="4.5" height="10" rx="1.2"/><rect x="9.8" y="4" width="4.5" height="16" rx="1.2"/><rect x="15.5" y="4" width="4.5" height="7" rx="1.2"/></svg>
      <div class="lb">任务</div><span class="bdg" id="bdg-task"></span>
    </button>
    <button class="nitem" data-action="nav" data-view="approval" title="审批">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 7.9-7.5 9.5-4.3-1.6-7.5-4.9-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>
      <div class="lb">审批</div>
    </button>
    <button class="nitem" data-action="nav" data-view="memory" title="记忆">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.8 4.6 4.7 1.7-4.7 1.7L12 16.1l-1.8-4.6-4.7-1.7 4.7-1.7z"/><circle cx="18.5" cy="17.5" r="1.4"/><circle cx="6" cy="18.5" r="1.1"/></svg>
      <div class="lb">记忆</div>
    </button>
    <button class="nitem" data-action="nav" data-view="summary" title="汇总">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3.5"/></svg>
      <div class="lb">汇总</div>
    </button>
    <button class="nitem" data-action="nav" data-view="rbac" title="权限">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8.5" r="4.2"/><path d="M11.6 11.6L20 20"/><path d="M16.5 16.5l-2 2"/><path d="M19 19l-1.4 1.4"/></svg>
      <div class="lb">权限</div>
    </button>
    <div class="sp"></div>
    <button class="nitem" data-action="nav" data-view="settings" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
      <div class="lb">设置</div>
    </button>
  </div>

  <!-- 右区：顶栏 + 视图容器 -->
  <div class="right">
    <div class="topbar">
      <div class="t" id="viewTitle">聊天</div>
      <div class="pill" id="presencePill" style="display:none">AI 在线</div>
      <div class="sp"></div>
      <button class="tbtn" id="themeBtn" data-action="toggleTheme" title="切换深浅主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
      </button>
      <div class="pill" id="meUser">admin</div>
    </div>

    <!-- 聊天视图（旧 DOM 原样挪入） -->
    <div class="view" id="view-chat">
      <div class="convs">
        <div class="sec">会话
          <button data-action="loadGatewayConversations" style="margin-left:auto;padding:3px 10px;border:1px solid var(--border);background:var(--panel);border-radius:8px;cursor:pointer;font-size:11px;color:var(--muted);">刷新</button>
        </div>
        <div class="session-list-fill" id="sessionList"></div>
      </div>
      <div class="chat">
        <div class="chat-header">
          <div>
            <div class="chat-title" id="chatTitle">选择会话</div>
            <div class="chat-sub" id="chatSub">点击左侧会话开始聊天</div>
          </div>
          <div class="chat-actions">
            <button data-action="loadTasks">刷新看板</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="sim-area">
          <div class="sim-toggle" data-action="toggleSim">🛠 模拟群消息（测试用）</div>
          <div class="sim-box" id="simBox" style="display:none;">
            <input id="simSender" class="sim-input" placeholder="发言人，如 王冰" value="王冰" />
            <input id="simText" class="sim-input" placeholder="消息内容，如 这次活动我来出物料清单，下周三前" />
            <button data-action="sendSim" class="sim-btn">发送</button>
          </div>
        </div>
        <div class="input-area">
          <div class="input-box">
            <textarea id="msg" rows="1" placeholder="输入消息...（Enter 发送）"></textarea>
            <button data-action="sendMsg">➤</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 任务工作台视图（空壳，后续 Task 填充渲染） -->
    <div class="view task" id="view-task">
      <div class="strip" id="stripPending"></div>
      <div class="cols">
        <div class="col"><div class="ct">待指派 <span class="n" id="countPendingAssignee">0</span></div><div id="listPendingAssignee"></div></div>
        <div class="col"><div class="ct">待确认 <span class="n" id="countPending">0</span></div><div id="listPending"></div></div>
        <div class="col"><div class="ct">已确认 <span class="n" id="countConfirmed">0</span></div><div id="listConfirmed"></div></div>
        <div class="col"><div class="ct">已完成 <span class="n" id="countDone">0</span></div><div id="listDone"></div></div>
      </div>
    </div>

    <!-- 审批视图（旧 panel-approval DOM 原样挪入） -->
    <div class="view func" id="view-approval">
      <div id="panel-approval">
        <div class="panel-toolbar">
          <span class="panel-title">高风险动作审批</span>
          <div class="board-tabs">
            <button class="tab active" data-action="approvalFilter" data-status="pending">待审批</button>
            <button class="tab" data-action="approvalFilter" data-status="approved">已批准</button>
            <button class="tab" data-action="approvalFilter" data-status="rejected">已拒绝</button>
            <button data-action="loadApprovals">刷新</button>
          </div>
        </div>
        <div id="approvalList" class="approval-list"></div>
      </div>
    </div>

    <!-- 汇总视图（旧 panel-summary + panel-minutes DOM 原样挪入） -->
    <div class="view func" id="view-summary">
      <div id="panel-summary">
        <div class="panel-toolbar">
          <span class="panel-title">今日汇总（未定归属）</span>
          <button data-action="loadSummary">生成</button>
        </div>
        <div id="summaryBox" class="summary-box"></div>
        <details class="sum-archive">
          <summary>已取消 / 已驳回</summary>
          <div class="sum-archive-block"><div class="memory-block-title">已取消</div><div id="sumCancelled"></div></div>
          <div class="sum-archive-block"><div class="memory-block-title">已驳回</div><div id="sumRejected"></div></div>
        </details>
      </div>
      <div id="panel-minutes" style="margin-top:16px;">
        <div class="panel-toolbar">
          <span class="panel-title">会议纪要</span>
          <button data-action="loadMinutes">刷新</button>
        </div>
        <div class="ai-card-btns" style="flex-wrap:wrap;gap:6px;margin-bottom:10px;">
          <select id="minutesConv" style="flex:2;min-width:140px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--cardbg);"></select>
          <input id="minutesLimit" type="number" value="50" min="1" max="500"
            style="width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--cardbg);">
          <button class="primary" data-action="generateMinutes">生成纪要</button>
        </div>
        <div id="minutesList" class="memory-box"></div>
      </div>
    </div>

    <!-- 权限视图（旧 panel-rbac DOM 原样挪入） -->
    <div class="view func" id="view-rbac">
      <div id="panel-rbac">
        <div class="rbac-section">
          <div class="panel-toolbar">
            <span class="panel-title">成员角色</span>
            <button data-action="loadRoles">刷新</button>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">未列出的用户默认 member；imAdmin 固定为 group_admin。修改角色需管理权限。</div>
          <div id="roleList" class="approval-list"></div>
          <div class="role-form">
            <input id="roleUserId" placeholder="OpenIM 用户ID（如 user001）" />
            <select id="roleValue">
              <option value="member">member</option>
              <option value="group_admin">group_admin</option>
            </select>
            <button class="primary" data-action="setRole" style="background:var(--grad);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;">保存角色</button>
          </div>
        </div>
        <div class="rbac-section">
          <div class="panel-toolbar">
            <span class="panel-title">审计日志（关键动作留痕）</span>
            <button data-action="loadAudit">刷新</button>
          </div>
          <div id="auditList" class="approval-list"></div>
        </div>
      </div>
    </div>

    <!-- 记忆视图（旧 panel-memory DOM 原样挪入） -->
    <div class="view func" id="view-memory">
      <div id="panel-memory">
        <div class="panel-toolbar">
          <span class="panel-title">团队记忆</span>
          <button data-action="loadMemory">刷新</button>
        </div>
        <div id="memoryHtml" class="memory-box"></div>
        <div class="memory-block" style="margin-top:12px;">
          <div class="memory-block-title">历史挖掘（术语 / 称呼 / 遗漏任务）</div>
          <div class="ai-card-btns" style="flex-wrap:wrap;gap:6px;margin-bottom:8px;">
            <select id="mineConv" style="flex:2;min-width:140px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--cardbg);"></select>
            <input id="mineLimit" type="number" value="500" min="1" max="2000"
              style="width:76px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--cardbg);">
            <button class="primary" data-action="runMining">跑挖掘</button>
          </div>
          <div id="mineCands" class="memory-box" style="padding:0;"></div>
        </div>
      </div>
    </div>

    <!-- 设置视图（新建占位） -->
    <div class="view settings" id="view-settings">
      <div class="set-card">
        <h3>默认落地页</h3>
        <label><input type="radio" name="setLanding" data-action="setLanding" value="chat" /> 聊天</label>
        <label><input type="radio" name="setLanding" data-action="setLanding" value="task" /> 任务工作台</label>
      </div>
      <div class="set-card">
        <h3>主题</h3>
        <label><input type="radio" name="setThemeMode" data-action="setThemeMode" value="light" /> 浅色</label>
        <label><input type="radio" name="setThemeMode" data-action="setThemeMode" value="dark" /> 深色</label>
      </div>
      <div class="set-card">
        <h3>账号</h3>
        <button class="danger-act" data-action="logout">退出登录</button>
      </div>
    </div>

  </div>
</div>

<div class="backend-status" id="backendStatus">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">后端连接中...</span>
  <button id="startBtn" data-action="startBackend">启动后端</button>
  <button id="diagBtn" style="background:#5a6482;" data-action="runDiagnose">诊断</button>
</div>
<div class="backend-status" id="sdkStatus" style="bottom:44px;font-weight:600;">SDK 状态：待初始化</div>

<script src="app.js?v=20260903063708"></script>
</body>
</html>
